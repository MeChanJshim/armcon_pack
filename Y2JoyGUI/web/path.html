<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y2JoyGUI Path Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #1b1d22;
      --panel-2: #22252b;
      --line: #353941;
      --text: #f1f3f5;
      --muted: #aab0bb;
      --green: #36c275;
      --blue: #4ba3ff;
      --red: #ff6868;
      --focus: #95c7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .choice-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .choice-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
    }

    input[type="radio"] {
      accent-color: var(--blue);
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0;
      padding: 0 13px;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    button:hover {
      border-color: var(--focus);
      background: #292d34;
    }

    button:active {
      transform: translateY(1px);
    }

    .write {
      color: var(--green);
    }

    .delete {
      min-width: 34px;
      color: var(--red);
      padding: 0;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .unit-bar {
      display: grid;
      gap: 4px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .unit-bar strong {
      color: var(--text);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 7px;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #202329;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      width: 48px;
      min-width: 48px;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    th:last-child,
    td:last-child {
      width: 50px;
      min-width: 50px;
      border-right: 0;
      text-align: center;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .cell-value {
      width: 100%;
      min-width: 72px;
      height: 34px;
      border: 1px solid #2d323a;
      border-radius: 6px;
      background: #14161a;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 0 8px;
      font-variant-numeric: tabular-nums;
      line-height: 32px;
      overflow: hidden;
      white-space: nowrap;
      cursor: cell;
      user-select: none;
    }

    .cell-value:focus {
      outline: 2px solid rgba(149, 199, 255, 0.28);
      border-color: var(--focus);
    }

    .cell-value.selected {
      border-color: var(--blue);
      background: rgba(75, 163, 255, 0.18);
    }

    .cell-value.editing {
      cursor: text;
      user-select: text;
      background: #14161a;
    }

    @media (max-width: 760px) {
      header {
        display: block;
      }

      .toolbar {
        align-items: stretch;
      }

      .choice-row {
        width: 100%;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Path Editor</h1>
      <div class="status" id="fileStatus">No file loaded.</div>
    </header>

    <div class="toolbar">
      <div class="choice-row" role="radiogroup" aria-label="Path type">
        <label><input type="radio" name="pathType" value="6D" checked>6D</label>
        <label><input type="radio" name="pathType" value="9D">9D</label>
      </div>
      <button id="readPath" type="button">Read</button>
      <button id="addRow" type="button">Add Row</button>
      <button id="writePath" class="write" type="button">Write</button>
    </div>

    <div class="status" id="status">Ready.</div>
    <div class="unit-bar" id="unitInfo"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const schemas = {
      '6D': ['x', 'y', 'z', 'wx', 'wy', 'wz', 'desired_lin_vel', 'desired_ang_vel', 'holding_time'],
      '9D': ['x', 'y', 'z', 'wx', 'wy', 'wz', 'fx', 'fy', 'fz', 'desired_lin_vel', 'desired_ang_vel', 'holding_time']
    };
    const units = {
      '6D': {
        summary: 'x, y, z: mm | wx, wy, wz: degree | desired_lin_vel: mm/s | desired_ang_vel: degree/s | holding_time: s',
        columns: ['mm', 'mm', 'mm', 'deg', 'deg', 'deg', 'mm/s', 'deg/s', 's']
      },
      '9D': {
        summary: 'x, y, z: mm | wx, wy, wz: degree | fx, fy, fz: N | desired_lin_vel: mm/s | desired_ang_vel: degree/s | holding_time: s',
        columns: ['mm', 'mm', 'mm', 'deg', 'deg', 'deg', 'N', 'N', 'N', 'mm/s', 'deg/s', 's']
      }
    };

    const headerRow = document.getElementById('headerRow');
    const tableBody = document.getElementById('tableBody');
    const statusEl = document.getElementById('status');
    const fileStatus = document.getElementById('fileStatus');
    const unitInfo = document.getElementById('unitInfo');
    let rows = [];
    let selectionStart = null;
    let selectionEnd = null;
    let isSelecting = false;

    function currentType() {
      return document.querySelector('input[name="pathType"]:checked').value;
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function getJson(path) {
      const response = await fetch(path);
      const data = await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    async function postJson(path, payload) {
      const response = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    function blankRow(type) {
      return schemas[type].map(() => '0.0');
    }

    function render() {
      const type = currentType();
      const columns = schemas[type];
      const columnUnits = units[type].columns;
      headerRow.innerHTML = '';
      tableBody.innerHTML = '';
      unitInfo.innerHTML = `<strong>${type} units</strong><span>${units[type].summary}</span>`;

      ['#', ...columns, ''].forEach((column, index) => {
        const th = document.createElement('th');
        if (index > 0 && index <= columns.length) {
          th.textContent = `${column} (${columnUnits[index - 1]})`;
        } else {
          th.textContent = column;
        }
        headerRow.appendChild(th);
      });

      rows.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        const indexCell = document.createElement('td');
        indexCell.textContent = String(rowIndex + 1);
        tr.appendChild(indexCell);

        columns.forEach((column, columnIndex) => {
          const td = document.createElement('td');
          const cell = document.createElement('div');
          cell.className = 'cell-value';
          cell.contentEditable = 'false';
          cell.inputMode = 'decimal';
          cell.textContent = row[columnIndex] ?? '';
          cell.dataset.row = String(rowIndex);
          cell.dataset.column = String(columnIndex);
          cell.setAttribute('role', 'textbox');
          cell.setAttribute('aria-label', `${column} row ${rowIndex + 1}`);
          cell.tabIndex = 0;
          cell.addEventListener('input', () => {
            rows[rowIndex][columnIndex] = cell.textContent.trim();
            clearSelection();
          });
          cell.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              stopEditing(cell);
              selectSingleCell(rowIndex + 1, columnIndex);
            }
            if (event.key === 'Escape') {
              event.preventDefault();
              cell.textContent = rows[rowIndex][columnIndex] ?? '';
              stopEditing(cell);
            }
          });
          cell.addEventListener('mousedown', (event) => {
            if (cell.classList.contains('editing')) {
              return;
            }
            event.preventDefault();
            isSelecting = true;
            selectSingleCell(rowIndex, columnIndex);
            cell.focus({preventScroll: true});
          });
          cell.addEventListener('mouseover', () => {
            if (!isSelecting) {
              return;
            }
            selectionEnd = {row: rowIndex, column: columnIndex};
            updateSelection();
          });
          cell.addEventListener('dblclick', () => startEditing(cell));
          cell.addEventListener('blur', () => stopEditing(cell));
          td.appendChild(cell);
          tr.appendChild(td);
        });

        const actionCell = document.createElement('td');
        const remove = document.createElement('button');
        remove.className = 'delete';
        remove.type = 'button';
        remove.textContent = '-';
        remove.addEventListener('click', () => {
          rows.splice(rowIndex, 1);
          render();
        });
        actionCell.appendChild(remove);
        tr.appendChild(actionCell);
        tableBody.appendChild(tr);
      });
    }

    function clearSelection() {
      selectionStart = null;
      selectionEnd = null;
      document.querySelectorAll('.cell-value.selected').forEach((cell) => {
        cell.classList.remove('selected');
      });
    }

    function selectSingleCell(rowIndex, columnIndex) {
      selectionStart = {row: rowIndex, column: columnIndex};
      selectionEnd = {row: rowIndex, column: columnIndex};
      updateSelection();
      setStatus(`Selected row ${rowIndex + 1}, column ${schemas[currentType()][columnIndex]}.`);
    }

    function startEditing(cell, initialValue = null) {
      isSelecting = false;
      clearSelection();
      cell.contentEditable = 'true';
      cell.classList.add('editing');
      if (initialValue !== null) {
        cell.textContent = initialValue;
        rows[Number(cell.dataset.row)][Number(cell.dataset.column)] = initialValue;
      }
      cell.focus();
      selectCellText(cell);
    }

    function stopEditing(cell) {
      if (!cell.classList.contains('editing')) {
        return;
      }
      cell.textContent = cell.textContent.trim();
      rows[Number(cell.dataset.row)][Number(cell.dataset.column)] = cell.textContent;
      cell.contentEditable = 'false';
      cell.classList.remove('editing');
    }

    function selectCellText(cell) {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(cell);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function updateSelection() {
      document.querySelectorAll('.cell-value.selected').forEach((cell) => {
        cell.classList.remove('selected');
      });

      if (!selectionStart || !selectionEnd) {
        return;
      }

      const rowMin = Math.min(selectionStart.row, selectionEnd.row);
      const rowMax = Math.max(selectionStart.row, selectionEnd.row);
      const columnMin = Math.min(selectionStart.column, selectionEnd.column);
      const columnMax = Math.max(selectionStart.column, selectionEnd.column);

      document.querySelectorAll('.cell-value').forEach((cell) => {
        const row = Number(cell.dataset.row);
        const column = Number(cell.dataset.column);
        if (row >= rowMin && row <= rowMax && column >= columnMin && column <= columnMax) {
          cell.classList.add('selected');
        }
      });
    }

    function selectedText() {
      if (!selectionStart || !selectionEnd) {
        return '';
      }

      const rowMin = Math.min(selectionStart.row, selectionEnd.row);
      const rowMax = Math.max(selectionStart.row, selectionEnd.row);
      const columnMin = Math.min(selectionStart.column, selectionEnd.column);
      const columnMax = Math.max(selectionStart.column, selectionEnd.column);
      const lines = [];

      for (let rowIndex = rowMin; rowIndex <= rowMax; rowIndex += 1) {
        const values = [];
        for (let columnIndex = columnMin; columnIndex <= columnMax; columnIndex += 1) {
          values.push(rows[rowIndex]?.[columnIndex] ?? '');
        }
        lines.push(values.join('\t'));
      }

      return lines.join('\n');
    }

    function focusCell(rowIndex, columnIndex) {
      const cell = tableBody.querySelector(
        `.cell-value[data-row="${rowIndex}"][data-column="${columnIndex}"]`
      );
      if (cell) {
        cell.focus({preventScroll: true});
      }
    }

    function selectedStartCell() {
      if (!selectionStart || !selectionEnd) {
        return null;
      }
      return {
        row: Math.min(selectionStart.row, selectionEnd.row),
        column: Math.min(selectionStart.column, selectionEnd.column),
      };
    }

    function pasteCells(event, startRow, startColumn) {
      const text = event.clipboardData.getData('text/plain');
      if (!text.includes('\n') && !text.includes('\t')) {
        return;
      }

      event.preventDefault();
      const type = currentType();
      const width = schemas[type].length;
      const lines = text.replace(/\r\n?/g, '\n').split('\n');
      while (lines.length && lines[lines.length - 1] === '') {
        lines.pop();
      }
      const pastedRows = lines
        .map((line) => line.split(/\t| {2,}/).map((value) => value.trim()));

      pastedRows.forEach((pastedRow, rowOffset) => {
        const targetRow = startRow + rowOffset;
        while (rows.length <= targetRow) {
          rows.push(blankRow(type));
        }

        pastedRow.forEach((value, columnOffset) => {
          const targetColumn = startColumn + columnOffset;
          if (targetColumn < width) {
            rows[targetRow][targetColumn] = value;
          }
        });
      });

      render();
      focusCell(startRow, startColumn);
      const columnCount = Math.max(...pastedRows.map((row) => row.length));
      setStatus(
        `Pasted ${pastedRows.length} row(s) x ${columnCount} column(s) at ${schemas[type][startColumn] ?? 'end'}.`
      );
    }

    function coerceRowsForType(type, incomingRows) {
      const width = schemas[type].length;
      return incomingRows.map((row) => {
        const next = row.slice(0, width);
        while (next.length < width) {
          next.push('0.0');
        }
        return next;
      });
    }

    async function readPath() {
      const type = currentType();
      setStatus(`Reading ${type}.`);
      try {
        const data = await getJson(`/api/path/read?type=${encodeURIComponent(type)}`);
        rows = coerceRowsForType(type, data.path.rows);
        fileStatus.textContent = data.path.file;
        render();
        setStatus(`Loaded ${rows.length} rows from ${type}.`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function writePath() {
      const type = currentType();
      setStatus(`Writing ${type}.`);
      try {
        const data = await postJson('/api/path/write', {type, rows});
        rows = coerceRowsForType(type, data.path.rows);
        fileStatus.textContent = data.path.file;
        render();
        setStatus(`Saved ${rows.length} rows to ${type}.`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    document.querySelectorAll('input[name="pathType"]').forEach((input) => {
      input.addEventListener('change', () => {
        rows = [blankRow(currentType())];
        fileStatus.textContent = 'No file loaded.';
        render();
      });
    });

    document.getElementById('readPath').addEventListener('click', readPath);
    document.getElementById('writePath').addEventListener('click', writePath);
    document.getElementById('addRow').addEventListener('click', () => {
      rows.push(blankRow(currentType()));
      render();
    });

    document.addEventListener('mouseup', () => {
      isSelecting = false;
    });

    document.addEventListener('copy', (event) => {
      const text = selectedText();
      if (!text) {
        return;
      }
      event.clipboardData.setData('text/plain', text);
      event.preventDefault();
      setStatus('Copied selected cells.');
    });

    document.addEventListener('paste', (event) => {
      const targetCell = event.target instanceof Element
        ? event.target.closest('.cell-value')
        : null;
      if (targetCell?.classList.contains('editing')) {
        return;
      }
      const start = targetCell
        ? {
            row: Number(targetCell.dataset.row),
            column: Number(targetCell.dataset.column),
          }
        : selectedStartCell();
      if (!start) {
        return;
      }
      pasteCells(event, start.row, start.column);
    });

    document.addEventListener('keydown', (event) => {
      if (!selectionStart || event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }
      if (event.key.length !== 1) {
        return;
      }
      const start = selectedStartCell();
      const cell = tableBody.querySelector(
        `.cell-value[data-row="${start.row}"][data-column="${start.column}"]`
      );
      if (cell) {
        event.preventDefault();
        startEditing(cell, event.key);
      }
    });

    rows = [blankRow(currentType())];
    render();
  </script>
</body>
</html>
