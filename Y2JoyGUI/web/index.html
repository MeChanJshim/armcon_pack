<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y2JoyGUI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #1b1d22;
      --panel-2: #22252b;
      --line: #353941;
      --text: #f1f3f5;
      --muted: #aab0bb;
      --green: #36c275;
      --blue: #4ba3ff;
      --amber: #f2b84b;
      --red: #ff6868;
      --focus: #95c7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 32px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(242, 184, 75, 0.13);
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(54, 194, 117, 0.13);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 14px;
    }

    section {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0;
      cursor: pointer;
      transition: border-color 120ms ease, transform 120ms ease, background 120ms ease;
    }

    button:hover {
      border-color: var(--focus);
      background: #292d34;
    }

    button:active {
      transform: translateY(1px);
    }

    button[data-mode="Idling"] {
      color: #ffd98a;
    }

    button[data-mode="Guiding"] {
      color: #7de0a6;
    }

    button[data-mode="Joystick"] {
      color: #8dc5ff;
    }

    button[data-mode="Joystick_force"] {
      color: #ff9d9d;
    }

    .record-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .record-start {
      color: var(--green);
    }

    .record-stop {
      color: var(--red);
    }

    .axis-list {
      display: grid;
      gap: 10px;
    }

    .axis {
      display: grid;
      grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 54px;
      align-items: center;
      gap: 10px;
      min-height: 32px;
    }

    .axis label,
    .axis output {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .axis label {
      display: grid;
      gap: 2px;
      color: var(--text);
      line-height: 1.2;
    }

    .axis small {
      color: var(--muted);
      font-size: 11px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      min-height: 46px;
      font-size: 14px;
    }

    .log {
      margin-top: 14px;
      min-height: 42px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    @media (max-width: 760px) {
      header,
      .layout {
        display: block;
      }

      .status {
        margin-top: 12px;
      }

      section {
        margin-bottom: 14px;
      }

      .mode-grid,
      .record-row {
        grid-template-columns: 1fr;
      }

      .axis {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Y2JoyGUI</h1>
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">Connecting</span></div>
    </header>

    <div class="layout">
      <section>
        <h2>Command Mode</h2>
        <div class="mode-grid">
          <button data-mode="Idling" type="button">Idling</button>
          <button data-mode="Guiding" type="button">Guiding</button>
          <button data-mode="Joystick" type="button">Joystick</button>
          <button data-mode="Joystick_force" type="button">Joystick Force</button>
        </div>

        <div class="log" id="log">Ready.</div>
      </section>

      <section>
        <h2>Recording</h2>
        <div class="record-row">
          <button class="record-start" data-record="start" type="button">Start</button>
          <button class="record-stop" data-record="stop" type="button">Stop</button>
        </div>
      </section>
    </div>

    <section style="margin-top:14px">
      <h2>Joy Move Axes</h2>
      <div id="axisList" class="axis-list"></div>
      <div class="actions">
        <button id="sendAxes" type="button">Send Axes</button>
        <button id="zeroAxes" type="button">Neutral Axes</button>
      </div>
    </section>
  </main>

  <script>
    const logEl = document.getElementById('log');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const axisList = document.getElementById('axisList');
    const neutralAxes = [0, 0, 1, 0, 0, 0, 0, 0];
    const axisValues = [...neutralAxes];
    const axisMeta = [
      {name: 'Wy rotation', detail: 'Axis 0 -> Wy, 0.2 rad/s'},
      {name: 'Wx rotation', detail: 'Axis 1 -> Wx, 0.2 rad/s'},
      {name: 'Fz force', detail: 'Axis 2 -> Fz, neutral 1.0'},
      {name: 'Y move', detail: 'Axis 3 -> Y, 20 mm/s'},
      {name: 'X move', detail: 'Axis 4 -> X, 20 mm/s'},
      {name: 'Unused', detail: 'Axis 5 is not mapped'},
      {name: 'Wz rotation', detail: 'Axis 6 -> Wz, 0.2 rad/s'},
      {name: 'Z move', detail: 'Axis 7 -> Z, 20 mm/s'}
    ];

    function setLog(message) {
      logEl.textContent = message;
    }

    async function postJson(path, payload) {
      const response = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    async function checkStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        dot.classList.add('ok');
        statusText.textContent = `${data.robot_name} connected`;
      } catch (error) {
        dot.classList.remove('ok');
        statusText.textContent = 'Server unavailable';
      }
    }

    function renderAxes() {
      axisList.innerHTML = '';
      axisValues.forEach((value, index) => {
        const row = document.createElement('div');
        row.className = 'axis';

        const label = document.createElement('label');
        const title = document.createElement('span');
        title.textContent = axisMeta[index].name;
        const detail = document.createElement('small');
        detail.textContent = axisMeta[index].detail;
        label.append(title, detail);

        const input = document.createElement('input');
        input.type = 'range';
        input.min = '-1';
        input.max = '1';
        input.step = '0.01';
        input.value = value;

        const output = document.createElement('output');
        output.textContent = Number(value).toFixed(2);

        input.addEventListener('input', () => {
          axisValues[index] = Number(input.value);
          output.textContent = axisValues[index].toFixed(2);
        });

        row.append(label, input, output);
        axisList.appendChild(row);
      });
    }

    document.querySelectorAll('[data-mode]').forEach((button) => {
      button.addEventListener('click', async () => {
        const mode = button.dataset.mode;
        try {
          await postJson('/api/mode', {mode});
          setLog(`Published /cmdMode: ${mode}`);
        } catch (error) {
          setLog(error.message);
        }
      });
    });

    document.querySelectorAll('[data-record]').forEach((button) => {
      button.addEventListener('click', async () => {
        const action = button.dataset.record;
        try {
          await postJson('/api/record', {action});
          setLog(`Published recording ${action}`);
        } catch (error) {
          setLog(error.message);
        }
      });
    });

    document.getElementById('sendAxes').addEventListener('click', async () => {
      try {
        await postJson('/api/joy_move', {axes: axisValues});
        setLog('Published /joy_move axes');
      } catch (error) {
        setLog(error.message);
      }
    });

    document.getElementById('zeroAxes').addEventListener('click', async () => {
      neutralAxes.forEach((value, index) => {
        axisValues[index] = value;
      });
      renderAxes();
      try {
        await postJson('/api/joy_move', {axes: axisValues});
        setLog('Published neutral /joy_move axes');
      } catch (error) {
        setLog(error.message);
      }
    });

    renderAxes();
    checkStatus();
    setInterval(checkStatus, 2000);
  </script>
</body>
</html>
